name = "bdt-telegram-bot"
main = "src/index.ts"
compatibility_date = "2025-03-01"

# Smart placement: runs worker instances near Telegram servers and European D1 database
[placement]
mode = "smart"

# Cloudflare D1 Database binding (Western Europe location for low latency)
[[d1_databases]]
binding = "DB"
database_name = "bdt-bot-db-eu"
database_id = "2e929353-1633-41bf-88bf-bf744d994c5a"
migrations_dir = "migrations"

[vars]
# Supergroup ID for admin management commands
ADMIN_GROUP_ID = "-1004346734857"

# Forum topic thread ID dedicated for audit logs and alerts inside the admin group
LOGS_TOPIC_ID = "2074"

# Immutable vault channel ID for permanent asset storage
STORAGE_CHANNEL_ID = "-1004388493605"

# Worker public URL for background job self-invocation
WORKER_URL = "https://bdt-telegram-bot.fawzy-sukkar2005.workers.dev"

# Optional comma-separated admin user IDs; empty allows all admins in the admin group
ADMIN_USER_IDS = ""

# Automated daily Cron Trigger to sync direct files to the vault
# Runs daily at 12:00 UTC (3:00 PM Damascus time UTC+3)
[triggers]
crons = ["0 12 * * *"]
